<body><div class="shell"><header><a href="https://semicolonxss.github.io/Formwheel/">◉ Formwheel Hub</a><small>THE ORBIT CHRONICLES · COMPLETE EDITION</small><button id="exportSave" type="button">기록 내보내기</button><button id="importSave" type="button">기록 가져오기</button><input id="importFile" type="file" accept=".json,application/json" hidden><button id="reset" type="button">초기화</button></header><main><div class="orb" aria-hidden="true"><div class="core"></div></div><div class="eyebrow">FORMWHEEL STORY · SEASON 1</div><h1 id="title">THE FIRST SPIN</h1><p class="lead" id="subtitle">모든 회전에는 시작이 있다.</p><nav class="chapters" id="chapters" aria-label="챕터 선택"></nav><section class="panel" aria-live="polite"><div class="speaker" id="speaker"></div><div class="log" id="log"></div><div id="area"></div><div class="progress" aria-label="챕터 진행도"><div id="progress"></div></div><div class="controls" id="controls"></div><p class="muted" id="save"></p></section><aside class="journal" id="journal"><h2>◈ 탐험 일지</h2><div id="journalText"></div></aside><div class="notice">스토리의 회전과 외부 프로젝트 탐사 링크는 독립형 연출입니다. Quiz / AQS / Firebase의 실제 완료 기록·XP·배지는 아직 자동 연동되지 않으며, 여기서 받은 기록은 이 브라우저에만 저장됩니다.</div></main><footer>Formwheel Story · 2026 · Semicolon & Secol</footer></div>
<script>
(()=>{"use strict";
const KEY="formwheel_story_season1_v1";
const chapters=[
{title:"THE FIRST SPIN",short:"First Spin",sub:"모든 회전에는 시작이 있다.",speaker:"ORBIT SYSTEM",intro:"[SYSTEM] 연결되었습니다.\n[UNKNOWN] ...누군가 듣고 있나요?\n\n네 신호 중 하나를 선택하고 최초의 회전을 복원하세요.",scene:"[ORBIT] 회전 기록 조각을 찾았습니다.\n\nE _ H _\n\n'과거의 기억은 메아리로 남는다.'\n빈칸을 복원해 네 글자 신호를 입력하세요.",answer:"ECHO",hints:["메아리를 뜻하는 영어 단어예요.","기억과 관련된 네 신호 중 하나예요.","E로 시작하고 O로 끝나요."],reward:"FIRST SIGNAL",outro:"[ECHO] ...드디어 들리는구나.\n네가 복원한 기록은 첫 장에 불과해.\n다음 신호는 Quiz의 문 뒤에 숨어 있다.",link:["Quiz 프로젝트 탐사","https://semicolonxss.github.io/Formwheel_Quiz/"]},
{title:"ECHO PROTOCOL",short:"Echo",sub:"사라진 목소리가 같은 이름을 반복한다.",speaker:"ECHO",intro:"[ECHO] Quiz의 참가 코드에 남겨진 이름이 있어.\n그 문이 열리는지는 직접 확인해야 해.\n\n기억은 복제할 수 있어도, 처음의 소리는 하나뿐이지.",scene:"[TRANSMISSION] \nECHO → ?\n\n암호문: ROVG\n규칙: 알파벳을 세 칸 앞으로 이동해 만들어진 메시지다.\n원래 신호를 복원해 입력하세요. (ROT3 역변환)",answer:"OLSD",hints:["알파벳을 각각 세 칸 뒤로 옮겨보세요.","R→O, O→L입니다.","답은 O로 시작하는 네 글자입니다."],reward:"ECHO KEY",outro:"[ECHO] 같은 소리가 돌아와도 모든 것은 같지 않아.\n어딘가에서 기록을 잘라냈어. 다음은 위키의 빈 페이지를 찾아야 해.",link:["Quiz 탐사","https://semicolonxss.github.io/Formwheel_Quiz/"]},
{title:"LOST RECORDS",short:"Records",sub:"삭제된 기록은 완전히 사라지는가?",speaker:"ARCHIVE / WIKI",intro:"[SYSTEM] 누락 문서 발견.\n문서는 지워졌지만 일부는 서로 다른 방식으로 인코딩되어 남아 있다.\n\nWiki와 Decode를 열어 기록의 흔적을 조사해 보세요.",scene:"[ARCHIVE FRAGMENT] 56 4F 49 44\n\n이 숫자는 ASCII 문자를 16진수(HEX)로 쓴 기록입니다.\n영어 네 글자로 복원하세요.",answer:"VOID",hints:["16진수 두 자리마다 문자 한 개입니다.","56은 V이고 4F는 O입니다.","네 신호 중 공백을 의미하는 이름입니다."],reward:"ARCHIVE RESTORED",outro:"[VOID] 기록이 사라졌다고 해서 아무것도 남지 않는 건 아니야.\n그 빈칸은 너를 다른 곳으로 안내하기 위해 남겨졌어.",link:["Decode 탐사","https://semicolonxss.github.io/Formwheel_Decode/"]},
{title:"BROKEN ORBIT",short:"Broken Orbit",sub:"시간의 흔들림을 추적한다.",speaker:"RIFT DETECTOR",intro:"[SYSTEM] ORBIT 내부 시간이 어긋나고 있습니다.\n같은 회전인데 시작과 끝의 기록 순서가 뒤집혔습니다.\n\nTime과 Reflex는 균열을 추적할 단서가 됩니다.",scene:"[TIME LOG]\n01: R\n02: I\n03: F\n04: T\n\n이 네 신호가 나타낸 균열의 이름을 순서대로 입력하세요.",answer:"RIFT",hints:["숫자가 표시하는 순서대로 읽으세요.","차원을 잇는 균열을 뜻하는 이름입니다.","첫 글자는 R입니다."],reward:"RIFT TRACKER",outro:"[RIFT] 틈이 생겼기에 새로운 길이 열린 거야.\n문제는 균열이 아니라, 그 너머를 보지 않으려는 마음이지.",link:["Time 탐사","https://semicolonxss.github.io/Formwheel_Time/"]},
{title:"FOUR SIGNALS",short:"Signals",sub:"네 개의 선택은 서로 다른 길인가?",speaker:"ORBIT CORE",intro:"[ORBIT] ECHO는 기억, NOVA는 탄생, VOID는 공백, RIFT는 변화.\n\n서로 다른 네 신호는 왜 하나의 궤도에서 나타났을까요?",scene:"[CORE PUZZLE]\n기억 → 공백 → 균열 → 새로운 탄생\n\n기록을 되찾은 뒤 새롭게 태어나는 신호의 이름을 입력하세요.",answer:"NOVA",hints:["마지막은 '새로운 탄생'입니다.","초신성을 뜻하는 영어 단어예요.","N으로 시작합니다."],reward:"FOUR SIGNALS",outro:"[NOVA] 네 신호는 적이 아니야.\n모두 같은 회전의 다른 순간들이었어.\n마지막 문을 열려면 하나의 원리를 이해해야 해.",link:["Secret 탐사 (Hub에서 숨은 단서 찾아보기)","https://semicolonxss.github.io/Formwheel/"]},
{title:"ONE MORE SPIN",short:"Finale",sub:"끝은 또 다른 시작이다.",speaker:"ORBIT / FINAL",intro:"[SYSTEM] 네 신호가 동기화되었습니다.\n[ECHO] 기억하라.\n[VOID] 비어 있는 곳을 보라.\n[RIFT] 경계를 넘어서라.\n[NOVA] 다시 시작하라.",scene:"[FINAL QUESTION]\n모든 프로젝트가 서로 다르지만, 하나의 세계에서 이어지는 이유는 무엇일까요?\n\n마지막 암호는 이 세계의 중심 시스템 이름, 다섯 글자입니다.",answer:"ORBIT",hints:["이 세계의 전체 테마 이름입니다.","모든 프로젝트를 연결하는 중심의 이름이에요.","O로 시작하는 다섯 글자입니다."],reward:"ORBIT MASTER",outro:"[ORBIT] 최초의 회전은 누군가의 선택에서 시작됐다.\n[ECHO] 나는 기록의 주인이 아니야. 기록이 남긴 목소리야.\n[ORBIT] 마지막 회전이 끝났습니다.\n\n하지만 다음 회전은 당신의 선택으로 시작됩니다."}
];
const identities={ECHO:"기억을 잇는 탐험가",NOVA:"가능성을 찾는 탐험가",VOID:"공백을 읽는 탐험가",RIFT:"경계를 넘는 탐험가"},$=id=>document.getElementById(id),blank=()=>({chapter:0,step:0,identity:"",choices:{},completed:[],hints:{},ending:""});
let s=blank();try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&Number.isInteger(raw.chapter)&&raw.chapter>=0&&raw.chapter<chapters.length&&Array.isArray(raw.completed))s={...blank(),...raw}}catch{}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s));$("save").textContent="진행 상황 자동 저장 · 이 브라우저 전용"}catch{$("save").textContent="저장이 제한된 환경입니다."}}
function node(tag,txt,cls){const e=document.createElement(tag);e.textContent=txt;if(cls)e.className=cls;return e}
function button(label,handler,main=false){const e=node("button",label,main?"primary":"");e.type="button";e.addEventListener("click",handler);$("controls").append(e);return e}
function go(step){s.step=step;save();render()}
function updateNav(){const nav=$("chapters");nav.replaceChildren();chapters.forEach((c,i)=>{const b=node("button",(s.completed.includes(i)?"✓ ":"")+(i===5?"FIN":String(i))+" "+c.short,"chapter"+(i===s.chapter?" active":"")+(s.completed.includes(i)?" done":""));b.disabled=i>0&&!s.completed.includes(i-1);b.setAttribute("aria-current",i===s.chapter?"step":"false");b.onclick=()=>{s.chapter=i;s.step=s.completed.includes(i)?4:0;save();render()};nav.append(b)})}
function nextChapter(){if(s.chapter<chapters.length-1){s.chapter++;s.step=0;save();render()}}
function finish(){if(!s.completed.includes(s.chapter))s.completed.push(s.chapter);s.step=4;if(s.chapter===5){const motive=s.choices["final"]||"EXPLORE";s.ending=motive}save();render()}
function render(){if(!Number.isInteger(s.step)||s.step<0||s.step>4)s.step=0;const c=chapters[s.chapter];$("title").textContent=c.title;$("subtitle").textContent=c.sub;$("area").replaceChildren();$("controls").replaceChildren();$("progress").style.width=(s.step/4*100)+"%";updateNav();$("journalText").replaceChildren();$("journalText").append(node("p","정체성: "+(s.identity||"미선택")));$("journalText").append(node("p","복원된 기록: "+s.completed.map(i=>chapters[i].reward).join(" · ") || ""));$("journalText").append(node("p","완료: "+s.completed.length+" / "+chapters.length+" 챕터"));const say=(who,msg)=>{$("speaker").textContent=who;$("log").textContent=msg};switch(s.step){
case 0:say(c.speaker,c.intro);if(s.chapter===0&&!s.identity){$("area").append(node("p","네 가지 중 자신의 정체성을 선택하세요.","muted"));const grid=node("div","","choices");Object.entries(identities).forEach(([id,description])=>{const b=node("button",id+" — "+description);b.setAttribute("aria-pressed",String(s.identity===id));b.onclick=()=>{s.identity=id;save();render()};grid.append(b)});$("area").append(grid);const proceed=button("정체성 확정 →",()=>go(1),true);proceed.disabled=!s.identity}else button("기록 탐색 시작 →",()=>go(1),true);break;
case 1:say(c.speaker,s.chapter===0?"[ORBIT] 첫 회전이 시작됩니다.\n선택: "+s.identity+"\n\n회전을 통해 기록 조각을 발견하세요.":c.intro+"\n\n신호 조각을 수집할 준비가 되었다면 계속하세요.");button(s.chapter===0?"스토리 회전 실행 →":"신호 기록 수집 →",()=>go(2),true);if(c.link){const link=node("a",c.link[0]+" ↗");link.href=c.link[1];link.target="_blank";link.rel="noopener noreferrer";link.style.marginLeft="8px";$("area").append(link)}break;
case 2:say("PUZZLE / "+c.title,c.scene);const input=node("input");input.placeholder="암호 입력";input.maxLength=24;input.autocomplete="off";input.className="field";input.setAttribute("aria-label","챕터 암호");$("area").append(input);const fb=node("p","","status");$("area").append(fb);const check=()=>{const v=input.value.trim().toUpperCase().replace(/\s+/g,"");if(v===c.answer){go(3)}else{fb.textContent="신호가 일치하지 않습니다. 단서를 다시 살펴보세요."}};input.addEventListener("keydown",e=>{if(e.key==="Enter")check()});button("암호 검증",check,true);button("힌트",()=>{s.hints[s.chapter]=Math.min(3,(s.hints[s.chapter]||0)+1);save();render()});if(s.hints[s.chapter])$("area").append(node("div",c.hints[s.hints[s.chapter]-1],"hint"));break;
case 3:say(c.speaker,c.outro);if(s.chapter===5){$("area").append(node("p","마지막으로 ORBIT가 어떤 미래를 향할지 선택하세요.","muted"));const options=[["EXPLORE","더 넓은 세상을 탐험한다"],["REMEMBER","지금까지의 기록을 보존한다"],["CONNECT","모든 프로젝트의 연결을 강화한다"]];const grid=node("div","","choices");options.forEach(([id,label])=>{const b=node("button",label);b.setAttribute("aria-pressed",String(s.choices.final===id));b.onclick=()=>{s.choices.final=id;save();render()};grid.append(b)});$("area").append(grid);const final=button("마지막 회전 완료",finish,true);final.disabled=!s.choices.final}else button("기록 수령 · 챕터 완료",finish,true);break;
case 4:say(s.chapter===5?"ORBIT / COMPLETE":"CHAPTER COMPLETE",s.chapter===5?"모든 기록이 복원되었습니다.\n\n"+({EXPLORE:"새로운 발견이 다음 궤도를 만든다.",REMEMBER:"남겨진 기억이 다음 궤도를 만든다.",CONNECT:"서로의 연결이 다음 궤도를 만든다."}[s.ending]||"모든 회전에는 다음이 있다.")+"\n\nTHE END — 그리고 다음 시작.":"["+c.reward+"] 기록을 복원했습니다.\n새로운 신호가 관측되었습니다.");$("area").append(node("div","✦ "+c.reward+" · STORY RECORD","reward"));if(s.chapter===5){$("area").append(node("p","축하합니다! 시즌 1 전 챕터를 완료했습니다. 이 엔딩은 선택에 따라 메시지가 달라집니다.","end"));button("기록 다시 보기",()=>{s.chapter=0;s.step=4;save();render()},true)}else button("다음 챕터로 →",nextChapter,true);break}
save()}
$("exportSave").addEventListener("click",()=>{const blob=new Blob([JSON.stringify({format:"formwheel-story-save-v1",progress:s},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="formwheel-story-progress.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});
$("importSave").addEventListener("click",()=>$("importFile").click());
