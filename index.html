<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Formwheel Story — The First Spin</title><link rel="icon" href="https://semicolonxss.github.io/Formwheel/assets/formwheel-favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#30214f,#100c20 60%,#090812);color:#f0eaff;font:16px/1.7 system-ui,sans-serif;min-height:100vh}main{max-width:730px;margin:auto;padding:18px 18px 70px}a{color:#cfbdff}header{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px}header a{text-decoration:none;font-weight:750}.orbit{height:195px;display:grid;place-items:center;position:relative;margin-top:24px}.orbit:before,.orbit:after{content:"";position:absolute;width:210px;height:80px;border:2px solid #ac8af8;border-radius:50%;transform:rotate(-25deg);box-shadow:0 0 32px #a06bff66}.orbit:after{transform:rotate(50deg);width:180px;height:112px;border-color:#e2a6ff88}.core{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle,#fff,#bfa2ff 39%,#683bb9 65%,transparent 75%);box-shadow:0 0 45px #b38dff}.eyebrow{text-align:center;color:#baa3ee;font-size:12px;letter-spacing:2px}h1{text-align:center;font-size:clamp(32px,7vw,50px);margin:4px 0}p.intro{text-align:center;color:#c9bddf}.panel{border:1px solid #7257a4;background:#17122e;border-radius:22px;padding:25px;margin-top:30px;box-shadow:0 15px 45px #0006}.speaker{color:#bb9dfb;font-size:12px;letter-spacing:1px;font-weight:800}.log{white-space:pre-line;min-height:125px;background:#0c091a;border:1px solid #42325d;padding:18px;border-radius:14px;margin:12px 0;line-height:1.9}.progress{height:6px;background:#382c52;border-radius:8px;overflow:hidden;margin:18px 0}.progress div{height:100%;background:#b392ff;transition:width .3s}button{cursor:pointer;border:1px solid #7a61ac;background:#302245;color:#f6f0ff;padding:12px 17px;border-radius:12px;font:inherit}button.main{border:0;background:#ad8afc;color:#170c2e;font-weight:850}button:disabled{opacity:.45;cursor:not-allowed}button:focus-visible,input:focus-visible{outline:3px solid white;outline-offset:3px}.buttons{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.identities{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.identities button{text-align:left}.identities button[aria-pressed=true]{background:#60428f;border-color:#e2c7ff}.identities strong{display:block}.identities small{color:#c6b5df}input{width:100%;background:#0d0a1a;color:white;border:1px solid #977bc6;padding:13px;border-radius:10px;font:inherit;text-transform:uppercase;letter-spacing:2px}.hint,.reward{margin-top:14px;background:#2a1e48;border-left:3px solid #b394ff;padding:12px;border-radius:7px}.small{font-size:12px;color:#ad9ac9}.feedback{color:#f1c1eb}footer{text-align:center;color:#9786b4;font-size:12px;margin:35px 0}@media(max-width:480px){.identities{grid-template-columns:1fr}.panel{padding:17px}}
</style></head><body><main><header><a href="https://semicolonxss.github.io/Formwheel/">◉ Formwheel Hub</a><button id="reset">처음부터</button></header><div class="orbit" aria-hidden="true"><div class="core"></div></div><div class="eyebrow">ORBIT CHRONICLES · CHAPTER 00</div><h1>THE FIRST SPIN</h1><p class="intro">모든 회전에는 시작이 있다.<br>그러나 첫 회전을 기억하는 사람은 없다.</p><section class="panel" aria-live="polite"><div id="speaker" class="speaker">ORBIT SYSTEM</div><div class="log" id="log"></div><div class="progress"><div id="bar"></div></div><div id="area"></div><div class="buttons" id="buttons"></div><p class="small" id="saved"></p></section><footer>Formwheel Story · Semicolon & Secol · 2026<br>현재 버전은 독립형 프롤로그입니다. AQS 공식 XP 지급은 아직 연동되지 않았습니다.</footer></main>
<script>
(()=>{"use strict";const KEY="formwheel_story_ch0",el=id=>document.getElementById(id),fresh=()=>({step:0,identity:"",hint:0}),identity={ECHO:"기억 · 메아리",NOVA:"탄생 · 가능성",VOID:"공백 · 미지",RIFT:"균열 · 변화"};let data=fresh();try{const x=JSON.parse(localStorage.getItem(KEY));if(x&&Number.isInteger(x.step)&&x.step>=0&&x.step<=5&&typeof x.identity==="string")data={...fresh(),...x}}catch{};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));el("saved").textContent="이 브라우저에 자동 저장됨"}catch{el("saved").textContent="저장할 수 없는 브라우저 환경입니다"}};function node(tag,txt,cls){const n=document.createElement(tag);n.textContent=txt;if(cls)n.className=cls;return n}function add(label,fn,primary=false){const b=node("button",label,primary?"main":"");b.type="button";b.addEventListener("click",fn);el("buttons").append(b);return b}function advance(step){data.step=step;save();draw()}function draw(){el("area").replaceChildren();el("buttons").replaceChildren();el("bar").style.width=(data.step/5*100)+"%";const say=(speaker,text)=>{el("speaker").textContent=speaker;el("log").textContent=text};switch(data.step){
case 0:say("ORBIT SYSTEM","[SYSTEM] 연결 확인.\n[SYSTEM] 알 수 없는 신호가 관측되었습니다.\n[UNKNOWN] ...누군가 듣고 있나요?");add("신호 조사하기 →",()=>advance(1),true);break;
case 1:say("UNKNOWN / ECHO","나는 아주 오래전의 소리야.\n너는 어떤 신호를 따라가고 싶어?\n\n정체성은 언제든 바꿀 수 있어.");const grid=node("div","","identities");for(const [name,desc] of Object.entries(identity)){const b=node("button",name+" — "+desc);b.type="button";b.setAttribute("aria-pressed",String(data.identity===name));b.addEventListener("click",()=>{data.identity=name;save();draw()});grid.append(b)}el("area").append(grid);const choose=add("정체성 확정 →",()=>advance(2),true);choose.disabled=!data.identity;break;
case 2:say("ORBIT / FIRST SPIN","["+data.identity+"] 신호 연결 성공.\n첫 번째 회전으로 유실된 기록을 복원하세요.\n\n이것은 스토리 전용 회전이며 Wheel 실제 점수에는 영향이 없습니다.");add("첫 번째 회전 실행",()=>advance(3),true);add("정체성 다시 선택",()=>advance(1));break;
case 3:say("RECOVERED DATA / 001","[WHEEL] 회전 완료.\n[ORBIT] 기록 복원: E _ H _\n\n실마리 1: 이것은 네 신호 중 하나다.\n실마리 2: 과거의 기록과 메아리를 상징한다.\n\n네 글자로 완성해 입력하세요.");const input=node("input");input.placeholder="신호 코드";input.maxLength=8;input.autocomplete="off";input.setAttribute("aria-label","복원한 네 글자 신호");el("area").append(input);const feedback=node("p","","feedback");el("area").append(feedback);const submit=()=>{if(input.value.trim().toUpperCase()==="ECHO"){advance(4)}else{feedback.textContent="신호 불일치. 기록과 실마리를 다시 확인해 주세요."}};input.addEventListener("keydown",e=>{if(e.key==="Enter")submit()});add("신호 확인",submit,true);add("힌트 보기",()=>{data.hint=Math.min(3,(data.hint||0)+1);save();draw()});if(data.hint){const hints=["네 신호 중 '기억'을 나타내는 이름을 찾아봐.","E로 시작하며 O로 끝나는 네 글자야.","빈칸은 C와 O."];el("area").append(node("div",hints[data.hint-1],"hint"))}break;
case 4:say("ECHO / RECONNECTION","...드디어 들리는구나.\n네가 첫 회전을 복원했어.\n\n하지만 이것은 시작일 뿐.\n다음 신호는 Quiz 속에 숨어 있어.\n네가 찾은 이름은 새로운 문을 열 거야.");add("Chapter 0 완료하기",()=>advance(5),true);break;
case 5:say("CHAPTER 00 / COMPLETE","기록 복원 성공!\n정체성: "+data.identity+"\n기록: FIRST SIGNAL\n\n다음 장: ECHO PROTOCOL (개발 예정)");el("area").append(node("div","✦ FIRST SIGNAL — 프롤로그 완료!","reward"));el("area").append(node("p","이 보상은 스토리 화면 내 표시입니다. Formwheel ID 및 AQS XP와는 아직 연동되지 않았습니다.","small"));add("Quiz 열기 ↗",()=>window.open("https://semicolonxss.github.io/Formwheel_Quiz/","_blank","noopener,noreferrer"),true);add("정체성 변경",()=>advance(1));break;
}save()}el("reset").addEventListener("click",()=>{if(confirm("Chapter 0 진행 상황을 초기화할까요?")){data=fresh();save();draw()}});draw()})();
</script></body></html>
